name: Bug 反馈 / Bug Report
description: 报告特定文件无法预览、渲染异常、搜索错位或服务报错等问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: format
    attributes:
      label: 涉及文件格式 / File Format
      multiple: false
      options:
        - PPT (.pptx)
        - Word (.docx)
        - Excel / CSV (.xlsx / .xls / .csv / .tsv)
        - PDF (.pdf)
        - MP4 (.mp4)
        - HTML (.html / .htm)
        - 插件安装 / 侧边栏整体 / Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本 / Plugin Version
      placeholder: 例如：v0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Reproduction
      description: 请尽可能说明文件大小、大致特征（例如是否包含大量空行、合并单元格或加密 PDF），以及实际表现。
      placeholder: |
        1. 打开的文件类型与体积：
        2. 执行了什么操作：
        3. 预期表现：
        4. 实际结果 / 错误提示：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错信息或控制台日志（可选）/ Error Messages or Logs (Optional)
      render: text
